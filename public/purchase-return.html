<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>برگشت خرید</title>

    <link
        rel="stylesheet"
        href="/css/style.css">

</head>

<body>

<header class="header">

    <h1>
        سیستم مدیریت دواخانه
    </h1>

</header>


<main class="container">


    <!-- عنوان -->

    <div class="page-title">

        <h2>
            برگشت دوا به شرکت
        </h2>

        <div style="display:flex; gap:10px;">

            <button
                type="button"
                onclick="window.location.href='/'">

                🏠 داشبورد

            </button>

            <button
                type="button"
                onclick="history.back()">

                ← بازگشت

            </button>

        </div>

    </div>


    <!-- انتخاب خرید -->

    <div class="form-container">

        <h3>
            انتخاب فاکتور خرید
        </h3>


        <div class="form-grid">


            <div class="form-group">

                <label for="purchaseSelect">
                    فاکتور خرید
                </label>

                <select id="purchaseSelect">

                    <option value="">
                        انتخاب خرید
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    شرکت
                </label>

                <input
                    type="text"
                    id="supplierName"
                    readonly
                    placeholder="شرکت">

            </div>


            <div class="form-group">

                <label>
                    مبلغ خرید
                </label>

                <input
                    type="text"
                    id="purchaseTotal"
                    readonly
                    value="0">

            </div>


            <div class="form-group">

                <label>
                    مبلغ برگشت
                </label>

                <input
                    type="text"
                    id="returnTotal"
                    readonly
                    value="0">

            </div>


        </div>

    </div>


    <!-- اقلام خرید -->

    <div class="table-container">

        <h3>
            انتخاب اقلام برگشتی
        </h3>


        <table>

            <thead>

                <tr>

                    <th>
                        دوا
                    </th>

                    <th>
                        تعداد خرید
                    </th>

                    <th>
                        تعداد برگشتی
                    </th>

                    <th>
                        قیمت خرید
                    </th>

                    <th>
                        مبلغ برگشت
                    </th>

                </tr>

            </thead>


            <tbody id="returnItemsBody">

                <tr>

                    <td colspan="5">
                        ابتدا یک فاکتور خرید انتخاب کنید
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- توضیحات -->

    <div class="form-container">

        <div class="form-group">

            <label for="description">
                توضیحات
            </label>

            <textarea
                id="description"
                maxlength="255"
                placeholder="دلیل برگشت یا توضیحات..."></textarea>

        </div>

    </div>


    <!-- ثبت -->

    <div class="form-buttons">

        <button
            type="button"
            id="saveReturnBtn">

            ثبت برگشت خرید

        </button>


        <button
            type="button"
            class="cancel-btn"
            onclick="history.back()">

            انصراف

        </button>

    </div>


    <div
        id="message"
        style="margin-top:20px;">
    </div>


</main>


<script src="/js/purchase-return.js"></script>

</body>

</html>

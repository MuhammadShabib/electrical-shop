<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>پرداخت به شرکت</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="header">

    <h1>
        سیستم مدیریت دواخانه
    </h1>

</header>


<main class="container">

    <div class="page-title">

        <h2>
            ثبت پرداخت به شرکت
        </h2>

        <button
            type="button"
            onclick="history.back()">
            ← بازگشت
        </button>

    </div>


    <div class="form-container">

        <form id="paymentForm">

            <div class="form-grid">

                <!-- شرکت -->

                <div class="form-group">

                    <label for="supplier">
                        شرکت
                    </label>

                    <select
                        id="supplier"
                        required>

                        <option value="">
                            در حال دریافت شرکت ها...
                        </option>

                    </select>

                </div>


                <!-- مبلغ -->

                <div class="form-group">

                    <label for="amount">
                        مبلغ پرداختی
                    </label>

                    <input
                        type="number"
                        id="amount"
                        min="0.01"
                        step="0.01"
                        placeholder="مبلغ را وارد کنید"
                        required>

                </div>


                <!-- روش پرداخت -->

                <div class="form-group">

                    <label for="paymentMethod">
                        روش پرداخت
                    </label>

                    <select
                        id="paymentMethod"
                        required>

                        <option value="cash">
                            نقدی
                        </option>

                        <option value="card">
                            کارت
                        </option>

                        <option value="transfer">
                            انتقال بانکی
                        </option>

                    </select>

                </div>


                <!-- توضیحات -->

                <div class="form-group">

                    <label for="description">
                        توضیحات
                    </label>

                    <input
                        type="text"
                        id="description"
                        maxlength="255"
                        placeholder="توضیحات پرداخت">

                </div>

            </div>


            <!-- مانده شرکت -->

            <div style="margin-top:20px;">

                مانده حساب شرکت:

                <strong id="balanceAmount">
                    0
                </strong>

                افغانی

            </div>


            <div
                id="message"
                style="margin-top:20px;">
            </div>


            <div style="margin-top:20px;">

                <button type="submit">
                    💰 ثبت پرداخت
                </button>

                <button
                    type="button"
                    onclick="history.back()">
                    انصراف
                </button>

            </div>

        </form>

    </div>

</main>


<script src="/js/supplier-payment.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>لیست خریدها</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="header">

    <h1>
        سیستم مدیریت دواخانه
    </h1>

</header>


<main class="container">

    <div class="page-title">

        <h2>
            لیست خریدها
        </h2>

        <div>

            <button
                type="button"
                onclick="window.location.href='/purchases.html'">
                + ثبت خرید جدید
            </button>

            <button
                type="button"
                onclick="window.location.href='/'">
                ← بازگشت
            </button>

        </div>

    </div>


    <!-- جستجو -->

    <div class="form-container">

        <div class="form-grid">

            <div class="form-group">

                <label>
                    جستجو
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="شماره خرید یا نام شرکت..."
                >

            </div>

        </div>

    </div>


    <!-- جدول خریدها -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        #
                    </th>

                    <th>
                        شماره خرید
                    </th>

                    <th>
                        شرکت
                    </th>

                    <th>
                        مبلغ کل
                    </th>

                    <th>
                        پرداختی
                    </th>

                    <th>
                        باقی‌مانده
                    </th>

                    <th>
                        تاریخ
                    </th>

                    <th>
                        عملیات
                    </th>

                </tr>

            </thead>


            <tbody id="purchasesTableBody">

                <tr>

                    <td colspan="8">
                        در حال دریافت اطلاعات...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <!-- جمع‌بندی -->

    <div class="form-container">

        <div class="summary-row">

            <span>
                تعداد خریدها:
            </span>

            <strong id="purchaseCount">
                0
            </strong>

        </div>


        <div class="summary-row">

            <span>
                مجموع خرید:
            </span>

            <strong id="totalPurchases">
                0
            </strong>

            <span>
                افغانی
            </span>

        </div>


        <div class="summary-row">

            <span>
                مجموع پرداختی:
            </span>

            <strong id="totalPaid">
                0
            </strong>

            <span>
                افغانی
            </span>

        </div>


        <div class="summary-row">

            <span>
                مجموع بدهی:
            </span>

            <strong id="totalRemaining">
                0
            </strong>

            <span>
                افغانی
            </span>

        </div>

    </div>

</main>


<script src="/js/purchases-list.js"></script>

</body>

</html>

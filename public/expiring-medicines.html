<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        دواهای تاریخ کم
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >


<style>
    @media print {

        .header {
            display: none;
        }

        .page-title button,
        .form-container {
            display: none !important;
        }

        .container {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        table {
            width: 100%;
        }

        #message {
            display: none;
        }

        body {
            background: #fff;
        }

    }
</style>

</head>


<body>

<header class="header">

    <h1>
        سیستم مدیریت دواخانه
    </h1>

</header>


<main class="container">


    <!-- عنوان -->

   <div class="page-title">

    <h2>
        دواهای تاریخ کم
    </h2>

    <div style="display:flex; gap:10px;">

        <button
            type="button"
            onclick="window.print()"
        >
            🖨 چاپ
        </button>

     <button
            type="button"
            onclick="window.location.href='/reports-menu.html'">

            📊 گزارشات

        </button>

    </div>

</div>


    <!-- تنظیم بازه -->

    <div class="form-container">

        <div
            style="
                display:flex;
                align-items:end;
                gap:10px;
                flex-wrap:wrap;
            "
        >

            <div class="form-group">

                <label>
                    نمایش دواهایی که تا چند روز آینده منقضی می‌شوند؟
                </label>

                <input
                    type="number"
                    id="daysInput"
                    min="1"
                    value="30"
                    style="width:150px;"
                >

            </div>


            <button
                type="button"
                id="searchBtn"
            >
                🔍 نمایش
            </button>

        </div>

    </div>


    <!-- جدول -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        #
                    </th>

                    <th>
                        کد دوا
                    </th>

                    <th>
                        نام دوا
                    </th>

                    <th>
                        شماره بچ
                    </th>

                    <th>
                        تاریخ انقضا
                    </th>

                    <th>
                        موجودی
                    </th>

                    <th>
                        روز باقی‌مانده
                    </th>

                    <th>
                        وضعیت
                    </th>

                </tr>

            </thead>


            <tbody id="expiringTableBody">

                <tr>

                    <td colspan="8">
                        در حال دریافت اطلاعات...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <div
        id="message"
        style="margin-top:20px;"
    >
    </div>


</main>


<script
    src="/js/expiring-medicines.js"
></script>

</body>

</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>مدیریت هزینه‌ها</title>

    <link
        rel="stylesheet"
        href="/css/style.css">
</head>

<body>

<header class="header">

    <h1>
        سیستم مدیریت دواخانه
    </h1>

</header>


<main class="container">


    <!-- عنوان -->

    <div class="page-title">

        <h2>
            مدیریت هزینه‌ها
        </h2>

        <div>

            <button
                type="button"
                onclick="window.location.href='/'">
                🏠 داشبورد
            </button>

        </div>

    </div>


    <!-- فرم ثبت هزینه -->

    <div class="form-container">

        <h3>
            ثبت هزینه جدید
        </h3>


        <form id="expenseForm">

            <div class="form-grid">


                <div class="form-group">

                    <label for="title">
                        عنوان هزینه
                    </label>

                    <input
                        type="text"
                        id="title"
                        maxlength="150"
                        placeholder="مثلاً نان چاشت"
                        required>

                </div>


                <div class="form-group">

                    <label for="amount">
                        مبلغ
                    </label>

                    <input
                        type="number"
                        id="amount"
                        min="0.01"
                        step="0.01"
                        placeholder="مبلغ هزینه"
                        required>

                </div>


                <div class="form-group">

                    <label for="expenseDate">
                        تاریخ
                    </label>

                    <input
                        type="datetime-local"
                        id="expenseDate">

                </div>


                <div class="form-group full-width">

                    <label for="description">
                        توضیحات
                    </label>

                    <textarea
                        id="description"
                        maxlength="255"
                        placeholder="توضیحات هزینه..."></textarea>

                </div>

            </div>


            <div
                id="message"
                style="margin-top:20px;">
            </div>


            <div class="form-buttons">

                <button
                    type="submit">
                    ثبت هزینه
                </button>

                <button
                    type="reset"
                    class="cancel-btn">
                    پاک کردن
                </button>

            </div>

        </form>

    </div>


    <!-- خلاصه -->

    <div class="form-container">

        <div class="summary-row">

            <span>
                تعداد هزینه‌ها:
            </span>

            <strong id="expenseCount">
                0
            </strong>

        </div>


        <div class="summary-row">

            <span>
                مجموع هزینه‌ها:
            </span>

            <strong id="totalExpenses">
                0
            </strong>

            <span>
                افغانی
            </span>

        </div>

    </div>


    <!-- لیست هزینه‌ها -->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        #
                    </th>

                    <th>
                        عنوان
                    </th>

                    <th>
                        مبلغ
                    </th>

                    <th>
                        تاریخ
                    </th>

                    <th>
                        توضیحات
                    </th>

                </tr>

            </thead>


            <tbody id="expensesBody">

                <tr>

                    <td colspan="5">
                        در حال دریافت اطلاعات...
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</main>


<script src="/js/expenses.js"></script>

</body>

</html>

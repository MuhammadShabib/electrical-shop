<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        ورود به سیستم
    </title>

    <link
        rel="stylesheet"
        href="/css/style.css">

    <style>

        body.login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: var(--card-background, #fff);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .login-box h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .login-box .login-subtitle {
            text-align: center;
            margin-bottom: 25px;
            color: #666;
        }

        .login-box .form-group {
            margin-bottom: 18px;
        }

        .login-box button {
            width: 100%;
            margin-top: 10px;
        }

        .login-message {
            margin-top: 15px;
            text-align: center;
        }

        .login-error {
            color: #dc2626;
        }

        .login-success {
            color: #16a34a;
        }

    </style>

</head>


<body class="login-page">


<main class="login-box">

    <h1 id="loginSystemTitle">
        سیستم مدیریت فروشگاه
    </h1>


    <div class="login-subtitle">
        برای ادامه وارد سیستم شوید
    </div>


    <form id="loginForm">


        <div class="form-group">

            <label for="username">
                نام کاربری
            </label>

            <input
                type="text"
                id="username"
                autocomplete="username"
                required
                placeholder="نام کاربری">

        </div>


        <div class="form-group">

            <label for="password">
                رمز عبور
            </label>

            <input
                type="password"
                id="password"
                autocomplete="current-password"
                required
                placeholder="رمز عبور">

        </div>


        <button
            type="submit"
            id="loginBtn">

            🔐 ورود به سیستم

        </button>


    </form>


    <div
        id="loginMessage"
        class="login-message">
    </div>

</main>


<script src="/js/system-settings.js"></script>
<script src="/js/login.js"></script>

</body>

</html>

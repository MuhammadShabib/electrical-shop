<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت پرداخت مشتری</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header class="header">
    <h1>سیستم مدیریت دواخانه</h1>
</header>

<main class="container">

    <div class="page-title">

        <h2>ثبت پرداخت مشتری</h2>

        <button
            type="button"
            onclick="history.back()">
            ← بازگشت
        </button>

    </div>


    <div class="form-container">

        <form id="paymentForm">

            <div class="form-grid">

                <div class="form-group">

                    <label for="customer">
                        مشتری
                    </label>

                    <select
                        id="customer"
                        required>

                        <option value="">
                            در حال دریافت مشتریان...
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="amount">
                        مبلغ پرداختی
                    </label>

                    <input
                        type="number"
                        id="amount"
                        min="0.01"
                        step="0.01"
                        placeholder="مبلغ را وارد کنید"
                        required>

                </div>


                <div class="form-group">

                    <label for="paymentMethod">
                        روش پرداخت
                    </label>

                    <select
                        id="paymentMethod"
                        required>

                        <option value="cash">
                            نقدی
                        </option>

                        <option value="card">
                            کارت
                        </option>

                        <option value="transfer">
                            انتقال بانکی
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        توضیحات
                    </label>

                    <input
                        type="text"
                        id="description"
                        maxlength="255"
                        placeholder="توضیحات پرداخت">

                </div>

            </div>


            <div
                id="customerBalance"
                style="margin-top:20px;">

                مانده حساب:
                <strong id="balanceAmount">
                    0
                </strong>
                افغانی

            </div>


            <div
                id="message"
                style="margin-top:20px;">
            </div>


            <div
                style="margin-top:20px;">

                <button type="submit">
                    💰 ثبت پرداخت
                </button>

                <button
                    type="button"
                    onclick="history.back()">
                    انصراف
                </button>

            </div>

        </form>

    </div>

</main>


<script src="/js/customer-payment.js"></script>

</body>

</html>
